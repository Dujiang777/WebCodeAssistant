# ---------------------------------------------------------------
# Spring Boot 后端配置
#
# 所有敏感值（数据库密码、模型 Key）一律走环境变量，仓库里不存任何密钥。
# 本地开发可以复制 application-local.yml.example 为 application-local.yml，
# 该文件已在 .gitignore 中排除。
# ---------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  # SSE 是长连接，不能被普通的读超时切断；超时设为 0 表示不限制。
  tomcat:
    connection-timeout: 30s

spring:
  application:
    name: web-code-assistant

  datasource:
    # MySQL 8（8.0.13+）。连接串里的参数都不是「可选优化」，逐个说明为什么必需：
    #   - characterEncoding=UTF-8 —— Connector/J 8 会把它落成 utf8mb4，中文/emoji 不会变问号；
    #   - allowPublicKeyRetrieval  —— MySQL 8 默认 caching_sha2_password，明文连接下取公钥要用它；
    #   - connectionTimeZone=+08:00
    #                              —— 注意这里写的是**数字偏移**而不是 'Asia/Shanghai'。
    #                                 MySQL 的命名时区依赖 mysql.time_zone_name 表，而 Windows 下的
    #                                 MySQL 默认不灌这张表，用名字会直接抛
    #                                 "Unknown or incorrect time zone"。偏移形式不需要时区表。
    #                                 中国无夏令时，+08:00 与 'Asia/Shanghai' 精确等价。
    #   - forceConnectionTimeZoneToSession
    #                              —— 把会话时区也钉死。否则数据库跑在别的时区（比如官方
    #                                 mysql 镜像默认 UTC）时，NOW() 写进去的墙钟时间和
    #                                 getTimestamp() 的解读会整体差 8 小时。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/webcode?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: wca-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
      connect-timeout: 2s

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:120MB}
      max-request-size: ${MAX_UPLOAD_SIZE:120MB}

  mvc:
    async:
      # SSE 长连接的超时；-1 表示由应用自己控制（我们按会话按需关闭）
      request-timeout: -1

app:
  workspace-root: ${WORKSPACE_ROOT:./data/workspaces}
  max-workspace-bytes: ${MAX_WORKSPACE_BYTES:209715200}
  max-read-bytes: ${MAX_READ_BYTES:524288}
  grep-max-results: ${GREP_MAX_RESULTS:50}
  max-tree-entries: ${MAX_TREE_ENTRIES:20000}
  max-archive-entries: ${MAX_ARCHIVE_ENTRIES:20000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-override-with-32-bytes-at-least}
    # access token 短、refresh token 长：客户端靠 refresh 静默续期，
    # 所以 access 短一点不伤体验，但能显著降低「令牌泄露还能用很久」的风险。
    ttl: ${JWT_TTL:PT2H}
    refresh-ttl: ${JWT_REFRESH_TTL:PT720H}
  git-clone:
    timeout: ${CLONE_TIMEOUT:PT180S}
    depth: ${CLONE_DEPTH:1}
  # 补丁应用后的编译验证。java-home 必须指向 JDK 17+，留空则继承进程环境。
  compile:
    enabled: ${COMPILE_ENABLED:true}
    maven-command: ${COMPILE_MVN:mvn}
    gradle-command: ${COMPILE_GRADLE:gradle}
    java-home: ${COMPILE_JAVA_HOME:}
    maven-settings: ${COMPILE_MVN_SETTINGS:}
    offline: ${COMPILE_OFFLINE:false}
    timeout: ${COMPILE_TIMEOUT:PT240S}
    max-output-chars: ${COMPILE_MAX_OUTPUT:24000}
  # 网页终端（功能 12）：只给登录用户用，模型没有任何命令执行工具。
  terminal:
    enabled: ${TERMINAL_ENABLED:true}
    timeout: ${TERMINAL_TIMEOUT:PT120S}
    max-output-chars: ${TERMINAL_MAX_OUTPUT:65536}

  # 账号体系（2026-09-24）。
  auth:
    # 连续失败多少次锁定、锁多久。没有这个阈值，密码就能被无限次撞。
    max-failed-attempts: ${AUTH_MAX_FAILED:5}
    lock-duration: ${AUTH_LOCK_DURATION:PT15M}
    # 邮箱验证 / 重置密码的令牌有效期与重发冷却。
    token-ttl: ${AUTH_TOKEN_TTL:PT30M}
    resend-cooldown: ${AUTH_RESEND_COOLDOWN:PT60S}
    # true = 未验证邮箱不能调用模型（文件浏览编辑仍可用）。默认关，避免锁住老账号。
    require-verified-email: ${AUTH_REQUIRE_VERIFIED_EMAIL:false}
    # 前端地址，用于拼接邮件里的验证 / 重置链接。
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    # 注册 / 找回密码的图形验证码（登录平时不需要：有账号级失败锁定）。
    captcha-enabled: ${AUTH_CAPTCHA_ENABLED:true}
    captcha-ttl: ${AUTH_CAPTCHA_TTL:PT5M}
    # 横向撞库防线：同 IP 窗口内登录失败过的不同用户名达到该数 → 登录强制验证码。0 = 关闭。
    login-fail-captcha-threshold: ${AUTH_LOGIN_FAIL_CAPTCHA_THRESHOLD:3}
    # 匿名认证接口的 IP 级限流：统计窗口与各动作的窗口内上限。
    ip-window: ${AUTH_IP_WINDOW:PT10M}
    ip-max-register: ${AUTH_IP_MAX_REGISTER:30}
    ip-max-login: ${AUTH_IP_MAX_LOGIN:90}
    ip-max-forgot: ${AUTH_IP_MAX_FORGOT:10}
    # 管理员引导名单（逗号分隔）。全新部署时用它造出第一个管理员；
    # 上线后建好管理员就清空它。留空 = 不引导。
    admin-usernames: ${ADMIN_USERNAMES:}

  # 邮件通道。mode=dev 不发真邮件（令牌落库 + 写日志 + 接口回显），上线改 smtp 并填下面几项。
  mail:
    mode: ${MAIL_MODE:dev}
    from: ${MAIL_FROM:no-reply@webcode.local}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    ssl: ${MAIL_SSL:false}

  # AI 用量积分。单价按「每 1000 token 多少积分」，输入便宜、输出贵。
  credit:
    # 注册赠送 = 每周免费额度的基准线（500 分 ≈ ¥5 的模型消耗）。
    signup-bonus: ${CREDIT_SIGNUP_BONUS:500}
    credits-per-1k-input: ${CREDIT_PER_1K_INPUT:1}
    credits-per-1k-output: ${CREDIT_PER_1K_OUTPUT:3}
    min-charge-per-turn: ${CREDIT_MIN_PER_TURN:1}
    # 每轮预扣多少分：结束时按真实 token 结算，多退少补。
    hold-credits: ${CREDIT_HOLD:30}
    low-balance-threshold: ${CREDIT_LOW_THRESHOLD:50}
    enforce-balance: ${CREDIT_ENFORCE:true}
    # 用户自带 API Key 的模型是否免积分。默认 true —— 那笔算力钱用户已经付给模型厂商了。
    byok-free: ${CREDIT_BYOK_FREE:true}
    # 单轮预扣的上限，防止旗舰模型一次预扣掉几百积分。
    hold-ceiling: ${CREDIT_HOLD_CEILING:600}
    # 免费额度重置周期（天）：到点把余额懒重置补至 signup-bonus。0 = 一次性赠送不重置。
    quota-reset-days: ${CREDIT_QUOTA_RESET_DAYS:7}

  # 用户自带 API Key 的加密主密钥。留空则回退 JWT_SECRET（本地开发不用多配一个变量）。
  # 生产建议单独设：换 JWT 密钥时不该把用户填的模型 Key 一起变成解不开的密文。
  secrets:
    secret-key: ${APP_SECRET:}

llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  # 语义检索用的 embedding 模型（OpenAI 兼容 /v1/embeddings）；留空 = 语义检索不可用
  embedding-model: ${LLM_EMBED_MODEL:}
  # embedding 可以指向另一个服务：DeepSeek 官方没有 embeddings 端点，
  # 常见组合是「对话接 DeepSeek + 语义检索接本地/别家」。留空 = 复用上面的 base-url / api-key。
  embedding-base-url: ${LLM_EMBED_BASE_URL:}
  embedding-api-key: ${LLM_EMBED_API_KEY:}
  temperature: ${LLM_TEMPERATURE:0.2}
  max-tokens: ${LLM_MAX_TOKENS:8192}
  timeout: ${LLM_TIMEOUT:PT120S}
  log-requests: ${LLM_LOG_REQUESTS:true}
  requests-per-second: ${LLM_REQUESTS_PER_SECOND:2}
  daily-token-limit: ${LLM_DAILY_TOKEN_LIMIT:500000}
  # 带进模型的历史消息条数（user+assistant 合计）。12 条 ≈ 6 轮，久聊之后
  # 用户早先说过的约束会掉出窗口，模型就会「再问一遍」——这也是「一直重复问
  # 同一个东西」的隐性成因之一。20 条在 DeepSeek 的上下文预算里仍然很轻。
  history-messages: ${LLM_HISTORY_MESSAGES:20}
  # 一轮对话的工具调用上限。12 步对「跨文件改动 + 补测试」这类真实任务偏紧，
  # 模型会半路收手，表现为「要求做一半就不做了」；提到 20 并配要求回执（见 AgentToolbox）。
  max-tool-steps: ${LLM_MAX_TOOL_STEPS:20}

logging:
  level:
    root: INFO
    com.webcode.assistant: ${LOG_LEVEL:INFO}
    # JGit 的进度日志很吵
    org.eclipse.jgit: WARN
