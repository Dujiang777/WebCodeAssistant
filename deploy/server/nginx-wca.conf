# ---------------------------------------------------------------------------
# WCA 站点 nginx 配置（Ubuntu 原生部署版）
#   /etc/nginx/sites-available/wca.conf  → 软链到 sites-enabled/
#
# 与仓库里 frontend/nginx.conf（Docker 版）的三点差别：
#   1. upstream 从容器名 backend:8080 换成 127.0.0.1:8080（后端跑在宿主机上）；
#   2. 静态根目录换成 /opt/wca/dist；
#   3. ★ 监听 8081 而不是 80 —— 这台机器的 80 端口被 Caddy 占着
#      （/etc/caddy/Caddyfile，另一个项目在用）。错开端口是最不打扰的做法：
#      不动别人的配置，WCA 也能独立重启。等以后有域名，再让 Caddy 反代过来。
#      访问地址：http://139.199.88.15:8081
# SSE 那几行必须原样保留 —— 少了 proxy_buffering off，流式回答会变成
# 「等模型全部说完再一次性蹦出来」。
# ---------------------------------------------------------------------------
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /opt/wca/dist;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ---- SSE 关键配置 ----
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 单页应用：未命中的路径回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
