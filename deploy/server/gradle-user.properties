# 放到 GRADLE_USER_HOME 下（build.sh 会拷到 /opt/wca/gradle-home/gradle.properties）
#
# 覆盖仓库里那份 backend/gradle.properties：那份写着 -Xmx2g，是给开发机（16G+）
# 用的；这台服务器只有 2G 物理内存，必须压到 1G 出头，并关掉并行构建
# （2 vCPU 上并行只会互相抢内存，不会更快）。
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configuration-cache=false
